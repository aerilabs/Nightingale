# Lefthook configuration
# Docs: https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  jobs:
    - name: auto format
      run: cargo fmt --all

    - name: verify formatting
      run: cargo fmt --all -- --check

    - name: clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

pre-push:
  jobs:
    - name: compile checks
      run: cargo check

commit-msg:
  jobs:
    - name: conventional commits check
      run: powershell -ExecutionPolicy Bypass -File ./.scripts/validate-commit-msg.ps1 "{1}"
